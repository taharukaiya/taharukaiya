<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background gradient: deep navy to slightly lighter -->
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0d2b"/>
      <stop offset="100%" stop-color="#1a0a3d"/>
    </linearGradient>

    <!-- Purple gradient for the monogram -->
    <linearGradient id="text-grad" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Subtle glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Border gradient -->
    <linearGradient id="border-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Rounded background square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="63" height="63" x="0.5" y="0.5" rx="13.5" fill="none" stroke="url(#border-grad)" stroke-width="1"/>

  <!-- Tiny dot accent top-right -->
  <circle cx="50" cy="14" r="2.5" fill="#9333ea" opacity="0.6"/>
  <circle cx="55" cy="10" r="1.5" fill="#a855f7" opacity="0.4"/>

  <!-- Letter R -->
  <g filter="url(#glow)">
    <path
      d="M13 16 L13 48 L18 48 L18 34 L25 34 L32 48 L38 48 L30.5 33.5 C34.5 32.2 37 29 37 25 C37 20 33 16 27 16 Z
         M18 20 L26 20 C29.5 20 32 22 32 25 C32 28 29.5 30 26 30 L18 30 Z"
      fill="url(#text-grad)"
    />

    <!-- Letter T -->
    <path
      d="M40 16 L40 20 L48 20 L48 48 L53 48 L53 20 L61 20 L61 16 Z"
      fill="url(#text-grad)"
    />
  </g>

  <!-- Small decorative underline accent -->
  <rect x="13" y="51" width="12" height="2" rx="1" fill="#9333ea" opacity="0.5"/>
  <rect x="40" y="51" width="12" height="2" rx="1" fill="#7c3aed" opacity="0.5"/>
</svg>